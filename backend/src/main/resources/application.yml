spring:
  application:
    name: banktrack-community
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/banktrack}
    username: ${DATABASE_USER:banktrack}
    password: ${DATABASE_PASSWORD:banktrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Firebase Authentication: https://securetoken.google.com/<firebase-project-id>
          issuer-uri: ${AUTH_ISSUER_URI:https://securetoken.google.com/banktrack}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

banktrack:
  auth:
    dev-header: ${DEV_AUTH:false}
  # Live alerts by Web Push (push/). PUSH_TICK_KEY lets a scheduler run a round with POST /push/tick on hosts
  # that sleep between requests; leave it empty to switch that call off.
  push:
    subject: ${PUSH_SUBJECT:https://jonathanemc23.github.io/BetAssistance/}
    tick-key: ${PUSH_TICK_KEY:}
  web-origins: ${WEB_ORIGINS:https://jonathanemc23.github.io}
