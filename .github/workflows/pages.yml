name: Web app

# Builds the web version of the app and publishes it with the share-link page
# to GitHub Pages:
#   https://jonathanemc23.github.io/BetAssistance/     the app (add it to the
#                                                      iPhone home screen from Safari)
#   https://jonathanemc23.github.io/BetAssistance/b/   shared bet links
# Pages must be switched on once: Settings > Pages > Source: GitHub Actions.
# Live alerts with the app closed need the alert server (backend/, on
# Render): its address is the PUSH_SERVER_URL repository variable. Without
# one the app only alerts while it's open.
on:
  push:
    branches: [main]
    paths: ['lib/**', 'web/**', 'assets/**', 'pubspec.*', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # CanvasKit is served from the site itself instead of Google's CDN.
      - run: flutter build web --release --base-href /BetAssistance/ --no-web-resources-cdn --dart-define=PUSH_SERVER=${{ vars.PUSH_SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
