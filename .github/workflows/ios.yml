name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Without the Apple secrets this only checks that the iPhone app builds.
      - name: Build unsigned
        if: env.HAS_SIGNING != 'true'
        run: flutter build ios --release --no-codesign

      # An unsigned IPA can't be installed as is. Sideloading tools (Sideloadly,
      # AltStore) sign it with the user's own Apple ID; with a free Apple ID the
      # app stops opening after 7 days until it is installed again.
      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          TAG="v${VERSION/+/-build}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p build/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned/Payload/
          (cd build/unsigned && zip -qry "bank-track-${TAG}-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v5
        if: env.HAS_SIGNING != 'true'
        with:
          name: bank-track-ipa-unsigned
          path: build/unsigned/*.ipa

      # Attach it to the version's GitHub release, next to the Android APK.
      - name: Publish unsigned IPA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_SIGNING != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="build/unsigned/bank-track-${TAG}-unsigned.ipa"
          NOTES="iPhone: bank-track-${TAG}-unsigned.ipa is not signed by Apple. Install it with Sideloadly or AltStore and your Apple ID; with a free Apple ID it has to be reinstalled every 7 days."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Bank Track ${TAG}" --notes "$NOTES" || true
          fi
          gh release upload "$TAG" "$FILE" --clobber

      # With them, sign for the App Store with the distribution certificate and
      # provisioning profile for com.banktrack.app.
      - name: Install certificate and profile
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/dist.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/dist.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done

          cat > ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.banktrack.app</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - uses: actions/upload-artifact@v5
        if: env.HAS_SIGNING == 'true'
        with:
          name: bank-track-ipa
          path: build/ios/ipa/*.ipa

      # Every signed build on main goes to TestFlight. Apple only takes each
      # build number (the part after + in pubspec.yaml) once, so a push that
      # doesn't bump it is skipped instead of failing.
      - name: Upload to TestFlight
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_SIGNING == 'true' && env.HAS_ASC_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          set +e
          OUT=$(xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUT" | grep -qiE 'bundle version must be higher|has already been (used|uploaded)|Redundant Binary Upload'; then
              echo "::notice::This build number is already on App Store Connect; bump version in pubspec.yaml to upload a new build."
            else
              exit $STATUS
            fi
          fi

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
