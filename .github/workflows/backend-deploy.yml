name: Deploy server

# Puts the server in backend/ on Google Cloud Run, with the database from
# Neon, and sets up a Cloud Scheduler job that runs a round of live alerts
# every minute (Cloud Run sleeps between requests, so the server's own
# timer can't be relied on). Skipped until the secrets exist:
#   GCP_SA_KEY     a Google Cloud service account key (JSON), see backend/README.md
#   DATABASE_URL   Neon's connection string, postgresql://user:password@host/db?sslmode=require
# The web app finds the server by itself after this (see pages.yml).
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  SERVICE: banktrack
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.GCP_SA_KEY != '' && secrets.DATABASE_URL != '' }}
    steps:
      - name: Waiting for the Google Cloud and Neon secrets
        if: env.READY != 'true'
        run: echo "::notice::GCP_SA_KEY or DATABASE_URL is missing, so the server isn't deployed. See backend/README.md."
      - uses: actions/checkout@v5
        if: env.READY == 'true'
      - uses: google-github-actions/auth@v2
        if: env.READY == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: env.READY == 'true'
      - name: Deploy to Cloud Run
        if: env.READY == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com cloudscheduler.googleapis.com
          # Neon gives postgresql://user:password@host/db?params; Spring wants
          # the JDBC address with the user and password apart.
          IFS=$'\t' read -r JDBC USER PASS < <(python3 -c '
          import sys, urllib.parse as u
          p = u.urlparse(sys.argv[1])
          print("jdbc:postgresql://%s%s%s" % (p.hostname + (":%d" % p.port if p.port else ""), p.path, "?" + p.query if p.query else ""),
                u.unquote(p.username or ""), u.unquote(p.password or ""), sep="\t")' "$DATABASE_URL")
          echo "::add-mask::$PASS"
          # The scheduler's key for POST /push/tick, the same on every deploy.
          TICK=$(printf '%s' "$DATABASE_URL tick" | sha256sum | cut -c1-40)
          echo "::add-mask::$TICK"
          printf 'DATABASE_URL: "%s"\nDATABASE_USER: "%s"\nDATABASE_PASSWORD: "%s"\nPUSH_TICK_KEY: "%s"\n' "$JDBC" "$USER" "$PASS" "$TICK" > env.yaml
          gcloud run deploy "$SERVICE" --source backend --region "$REGION" --allow-unauthenticated \
            --max-instances 1 --memory 512Mi --env-vars-file env.yaml --quiet
          rm env.yaml
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          if gcloud scheduler jobs describe banktrack-push-tick --location "$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http banktrack-push-tick --location "$REGION" --schedule '* * * * *' \
              --uri "$URL/push/tick" --http-method POST --update-headers "X-Tick-Key=$TICK" --attempt-deadline 60s --quiet
          else
            gcloud scheduler jobs create http banktrack-push-tick --location "$REGION" --schedule '* * * * *' \
              --uri "$URL/push/tick" --http-method POST --headers "X-Tick-Key=$TICK" --attempt-deadline 60s --quiet
          fi
          curl -sf "$URL/push/key" >/dev/null
          echo "Server: $URL" >> "$GITHUB_STEP_SUMMARY"
